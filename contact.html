<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        button { 
            background-color: #003366; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px;
            width: 100%;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0055a5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Связаться со мной</h1>
    </header>

    <nav>
        <a href="index.html">Главная</a>
        <a href="contact.html">Обратная связь</a>
    </nav>

    <main>
        <section>
            <h2>Форма контактов</h2>
            <p>Если у вас есть вопросы по учебе или предложения, напишите мне.</p>

            <form action="#" method="GET">
                <fieldset style="margin-bottom: 20px; border-color: #003366;"> <legend>Контактная информация</legend>

                    <div style="margin-bottom: 15px;"> <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="username" placeholder="Иван Иванов" required>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="useremail" placeholder="example@hse.ru">
                    </div>
                </fieldset>

                <fieldset style="margin-bottom: 20px; border-color: #003366;">
                    <legend>Сообщение</legend>
                    
                    <div style="margin-bottom: 15px;">
                        <label for="topic">Тема вопроса:</label>
                        <select id="topic" name="topic">
                            <option value="math">Прикладная математика</option>
                            <option value="collab">Сотрудничество</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label for="message">Текст сообщения:</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </div>
                </fieldset>

                <div>
                    <button type="submit">Отправить сообщение</button>
                </div>
            </form>
        </section>

        <aside style="background-color: #eee; padding: 15px; margin-top: 30px; border-radius: 5px;">
            <h4 style="margin-top: 0;">Контакты кафедры:</h4>
            <dl>
                <dt>Адрес:</dt>
                <dd>г. Москва, Таллинская ул., д. 34</dd>
                <dt>Email:</dt>
                <dd>miem@hse.ru</dd>
            </dl>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Лыков Максим. МИЭМ.</p>
    </footer>

</body>
</html>
