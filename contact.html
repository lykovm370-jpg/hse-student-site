<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обратная связь</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header, footer { background-color: #003366; color: white; padding: 20px; text-align: center; }
        nav { background-color: #0055a5; padding: 10px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        main { padding: 20px; max-width: 600px; margin: auto; background: white; }
        form { margin-top: 20px; }
        div { margin-bottom: 15px; } /* [cite: 32] Блочный элемент div для отступов */
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #003366; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Связаться со мной</h1>
    </header>

    <nav>
        <a href="index.html">Главная</a>
        <a href="contact.html">Обратная связь</a>
    </nav>

    <main>
        <section>
            <h2>Форма контактов</h2>
            <p>Если у вас есть вопросы по учебе или предложения, напишите мне.</p>

            <form action="#" method="GET">
                
                <fieldset>
                    <legend>Контактная информация</legend>

                    <div>
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="username" placeholder="Иван Иванов" required>
                    </div>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="useremail" placeholder="example@hse.ru">
                    </div>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Сообщение</legend>
                    
                    <div>
                        <label for="topic">Тема вопроса:</label>
                        <select id="topic" name="topic">
                            <option value="math">Прикладная математика</option>
                            <option value="collab">Сотрудничество</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div>
                        <label for="message">Текст сообщения:</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </div>
                </fieldset>

                <div>
                    <button type="submit">Отправить сообщение</button>
                </div>

            </form>
        </section>

        <aside>
            <h4>Контакты кафедры:</h4>
            <dl>
                <dt>Адрес:</dt>
                <dd>г. Москва, Таллинская ул., д. 34</dd>
                <dt>Email:</dt>
                <dd>miem@hse.ru</dd>
            </dl>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Лыков Максим. МИЭМ.</p>
    </footer>

</body>
</html>
